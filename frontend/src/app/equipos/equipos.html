<div class="text-white p-3 mx-auto mt-4" style="width: 90%;">
    <h1 class="fw-bold mb-2"> Equipos y Jugadores </h1>
    <p class="text-secondary mb-5"> Bienvenido a la sección de Equipos y Jugadores. Aquí podrás ver todos los equipos y sus respectivos jugadores. </p>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4">
        
        @for(e of equipos(); track e.id) {
        <div class="col">
            
            <div class="card h-100 team-card text-center">
                <a href="" class="img-container">
                    <img [src]="'imagenes/equipos/' + e.escudo" class="card-img-top team-logo" [alt]="e.nombre">
                </a>
                
                <div class="card-body d-flex align-items-center justify-content-center">
                    <h5 class="card-title fw-bold text-white mb-0 text-truncate text-uppercase" [title]="e.nombre">
                        {{ e.nombre }}
                    </h5>
                </div>
            </div>
            
        </div>
        }
        
    </div>    
</div>
